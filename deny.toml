# cargo-deny configuration.
#
# Run with `cargo deny check`. Advisories/bans/sources gate supply-chain
# integrity; the license allow-list below covers every permissive license
# currently present in Cargo.lock (verify with `cargo deny check licenses`
# before adding dependencies that need new entries).
#
# Crypto posture is aligned with the suite baseline (rustydns /
# rustynet): OpenSSL/native-tls stacks are banned outright, and the
# deprecated/legacy crypto crates (sha1, md-5, md5, rc4, ...) are banned
# too. The two charter-sanctioned legacy primitives used by BitTorrent
# protocols are covered by dated `# suite-exemption:` rows below
# (ADR-012 X2 / charter T2 §K). The exemptions are ENFORCED narrow via
# `wrappers`: a banned crate stays banned everywhere in the graph except
# as a direct dependency of the named wrapper crate.

[advisories]
version = 2
# Deny-by-default across the whole dependency graph (suite baseline),
# not just crates the workspace itself depends on directly.
unmaintained = "all"
unsound = "all"
# Yanked crates aren't an immediate vulnerability but they shouldn't
# end up in a release either — fail CI so we notice before shipping.
yanked = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"

# Version-pinned skip baseline (AQ-10 lesson: pin versions, not bare names, so a
# NEW duplicate still fails CI). windows-sys arrives in several versions
# transitively through the Windows dependency tree; collapsing them is tracked as
# a follow-up. Any version NOT listed here — a 5th windows-sys, or any other
# duplicated crate — fails the deny gate.
skip = [
    { name = "windows-sys", version = "=0.52.0" },
    { name = "windows-sys", version = "=0.59.0" },
    { name = "windows-sys", version = "=0.61.2" },
]

deny = [
    # Suite baseline: rustls backend only — no OpenSSL bindings, no
    # native-tls. reqwest is built with default-features = false and
    # rustls-tls (see Cargo.toml), so nothing in the graph pulls these.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    # rustls-pemfile: suite baseline ban (superseded by rustls-pki-types; keeps
    # the cert/key-parsing path on the maintained crate). Not in-graph.
    { name = "rustls-pemfile" },

    # Deprecated / broken crypto, banned outright with NO in-graph use.
    # MD5 family: practical collisions (Wang 2005) / preimage attacks.
    { name = "md-5" },
    # `md5` is a separate standalone crates.io package — ban both names
    # for parity with the suite baseline.
    { name = "md5" },
    { name = "md4" },
    { name = "md2" },
    # DES family: 56-bit keys, broken in practice.
    { name = "des" },
    { name = "3des" },
    { name = "des3" },
    { name = "rc2" },
    # Blowfish: suite baseline ban (64-bit block → sweet32; superseded). Not in-graph.
    { name = "blowfish" },

    # RC4 (the crates.io RustCrypto package): practical bias / recovery
    # attacks (RC4 NOMORE, Bar-Mitzvah); RFC 7465 prohibits it in TLS.
    # wrappers = [] keeps the crate fully banned — rustytorrent does NOT
    # depend on it. The RC4 in src/peer/mse/rc4.rs is hand-rolled for
    # BEP-8 MSE under the X2 exemption below; this ban still blocks
    # anyone from casually adding the `rc4` crate instead.
    #
    # suite-exemption: BEP-8 MSE RC4 — FULL-SESSION peer-stream obfuscation, NOT
    # handshake-only. Per BEP-8 full-encryption mode RC4 encrypts the entire peer
    # stream (all piece + control traffic; src/peer/mse/{handshake.rs:134,stream.rs}).
    # Non-confidential: the plaintext is public swarm data, and ANONYMITY.md:104
    # documents MSE as obfuscation, not encryption-of-record. This exemption also
    # DEPENDS on the SHA-1 exemption below (MSE key derivation uses SHA-1).
    # (Corrected 2026-09-13 per 2nd-review H1: prior text said "handshake only",
    # which the code contradicts.) expires 2027-03-01
    { name = "rc4", wrappers = [] },

    # X2 crypto exemption (ADR-012 X2 / charter T2 §K): BitTorrent v1
    # protocol-mandated legacy primitive. NON-CONFIDENTIAL use only — the
    # info-hash is a public identifier/integrity value, not a security
    # boundary. The `wrappers` list is the enforcement: sha1 stays banned
    # for every other consumer in the graph, and this entry must be
    # pruned when the exemption expires or the protocol requirement goes
    # away.
    #
    # suite-exemption: BT-v1 SHA-1, protocol-mandated, non-confidential. Full use
    # surface (2nd-review H2): info-hash + piece hashes (integrity of public swarm
    # data), MSE req1/req2/req3 key derivation (on which the RC4 exemption depends),
    # peer metadata-dict acceptance (dict whose SHA-1 == the magnet's own SHA-1
    # info-hash wins — the integrity anchor is itself SHA-1 by protocol), DHT spam
    # token SHA1(salt||ip) (non-cryptographic), and log-pseudonym PRF (no security
    # property rests on it). None authenticates confidential data. expires 2027-03-01
    { name = "sha1", wrappers = ["rustytorrent"] },
]

[licenses]
version = 2
allow = [
  # ADR-021 (OI-05): the suite is relicensed to PolyForm Noncommercial
  # 1.0.0 — free for noncommercial use, commercial use requires a
  # separate licence. This entry allows THIS crate's own licence; the
  # permissive entries below cover third-party dependencies. The id is a
  # valid SPDX identifier but NOT OSI-approved, and cargo-deny resolves it
  # directly from the crate manifest, so no [licenses.clarify] is needed.
  "PolyForm-Noncommercial-1.0.0",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
