# cargo-deny configuration.
#
# Run with `cargo deny check`. Advisories/bans/sources gate supply-chain
# integrity; the license allow-list below covers every permissive license
# currently present in Cargo.lock (verify with `cargo deny check licenses`
# before adding dependencies that need new entries).

[advisories]
version = 2
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"


[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
