[package]
name = "rustytorrent"
version = "0.1.0"
edition = "2021"
description = "A BitTorrent client built in Rust"
license = "MIT"

[dependencies]
tokio        = { version = "1", features = ["full"] }
sha1         = "0.10"
clap         = { version = "4", features = ["derive"] }
thiserror    = "1"
anyhow       = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test   = "0.4"
