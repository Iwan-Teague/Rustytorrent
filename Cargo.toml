[package]
name = "rustytorrent"
version = "0.1.0"
edition = "2021"
description = "A peer-to-peer file transfer client in Rust"
license = "MIT"
# `as_chunks` (1.88) and `is_multiple_of` (1.87) are used in the
# tracker/DHT/PEX parsers; the release profile also enables
# overflow-checks which requires no additional MSRV.
rust-version = "1.88"

[dependencies]
tokio        = { version = "1", features = ["full"] }
reqwest      = { version = "0.12", features = ["rustls-tls", "socks"], default-features = false }
sha1         = "0.10"
bitvec       = "1"
clap         = { version = "4", features = ["derive"] }
thiserror    = "1"
anyhow       = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand         = "0.8"
num-bigint   = "0.4"
num-traits   = "0.2"
lru          = "0.18"
zeroize      = { version = "1.8", features = ["derive"] }  # wipe crypto secrets on drop
subtle       = "2"                                          # constant-time byte comparisons
socket2      = "0.6"                                        # interface-binding for VPN kill switch
aes-gcm      = "0.10"                                       # AEAD for the --paranoid encrypted spool
argon2       = "0.5"                                        # passphrase-to-key derivation for --paranoid
axum         = { version = "0.7", default-features = false, features = ["http1", "tokio", "json"] }  # Phase 8 web monitoring server
serde        = { version = "1", features = ["derive"] }     # JSON status serialization
serde_json   = "1"                                          # JSON status serialization
rpassword    = "7"                                          # no-echo TTY passphrase prompt (--paranoid)

[target.'cfg(unix)'.dependencies]
libc         = "0.2"                                        # if_nametoindex for --bind-iface (Unix)

[dev-dependencies]
tokio-test   = "0.4"
sha1         = "0.10"  # build piece hashes in the end-to-end download test
proptest     = "1"     # property/fuzz tests for the untrusted-input parsers
tower        = { version = "0.5", features = ["util"] }  # oneshot requests against the web routers

# Security-first: arithmetic overflow becomes a controlled panic instead
# of a silent wraparound, even in optimized builds. Overhead is
# negligible for an IO/hash-bound workload (SHA-1 and disk dominate).
[profile.release]
overflow-checks = true
