name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily sweep (rustydns Tier-0 parity): re-runs every job, including
    # cargo-audit, so new RustSec advisories are caught between PRs.
    - cron: "30 5 * * *"

# Tier-0: read-only GITHUB_TOKEN by default for every job. No job in
# this workflow needs an elevation (no release/publish job).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # Cross-platform build + test matrix. Catches Windows-specific path issues,
  # macOS BSD socket quirks, and Linux/glibc edge cases without anyone having
  # to run the suite on three different machines.
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # SHA-pinned (Tier-0): every `uses:` below is pinned to a verified
      # commit, not a mutable tag. SHAs cross-checked against the
      # rustydns suite workflow; re-verify on bump.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified 2026-09-12)
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head (verified 2026-09-12)
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (verified 2026-09-12)
      - name: cargo build
        run: cargo build --all-targets --locked
      - name: cargo test
        run: cargo test --all --locked
      # Debug asserts hide arithmetic overflow; the release profile enables
      # overflow-checks, so exercise it too (linux-only to bound CI time).
      - name: cargo test --release (overflow-checks)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --all --locked

  # Style + lints — runs on a single platform since they're deterministic.
  lint:
    name: clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified 2026-09-12)
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head (verified 2026-09-12)
        with:
          components: clippy, rustfmt
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (verified 2026-09-12)
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # Keep rustdoc links honest — broken intra-doc links fail the build.
      - name: cargo doc
        run: cargo doc --no-deps --locked

  # Supply chain — enforces deny.toml (RustSec advisories, banned/duplicate
  # crates, license allow-list, crate source restrictions) on every push
  # and PR. deny.toml passing locally means nothing if CI never checks it.
  supply-chain:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified 2026-09-12)
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1 (verified 2026-09-12)
        with:
          command: check

  # Tier-0: independent RustSec advisory sweep (different tooling over the
  # same advisory DB as cargo-deny; `--deny warnings` also fails on
  # unmaintained/unsound warnings, matching the deny.toml posture). The
  # daily `schedule` trigger above is what catches new advisories.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified 2026-09-12)
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head (verified 2026-09-12)
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit --deny warnings
