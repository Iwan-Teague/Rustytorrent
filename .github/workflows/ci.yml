name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Cross-platform build + test matrix. Catches Windows-specific path issues,
  # macOS BSD socket quirks, and Linux/glibc edge cases without anyone having
  # to run the suite on three different machines.
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --all-targets --locked
      - name: cargo test
        run: cargo test --all --locked

  # Style + lints — runs on a single platform since they're deterministic.
  lint:
    name: clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  # Supply chain — enforces deny.toml (RustSec advisories, banned/duplicate
  # crates, license allow-list, crate source restrictions) on every push
  # and PR. deny.toml passing locally means nothing if CI never checks it.
  supply-chain:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
